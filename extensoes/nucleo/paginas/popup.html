<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Terra da Luz</title>
  <link rel="stylesheet" href="../estilo/base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="cab">
    <div class="marca"><img src="../icones/icone-48.png" alt=""> Terra da Luz</div>
    <span id="conteinerAtual" class="etiqueta oculto"></span>
  </header>

  <section class="site">
    <img id="favicon" alt="" width="28" height="28">
    <div class="site-info">
      <strong id="host">—</strong>
      <span id="cadeado" class="mudo"></span>
    </div>
    <span id="selo" class="etiqueta ok">Seguro</span>
  </section>

  <div id="alertaSite" class="alerta oculto"></div>

  <section class="bloco" id="blocoProtecao">
    <label class="linha">
      <span>
        <strong>Proteção contra rastreadores</strong>
        <small id="descProtecao" class="mudo">Ativa neste site</small>
      </span>
      <span class="chave"><input type="checkbox" id="protecaoSite"><span></span></span>
    </label>
    <div class="contagem">
      <div><b id="cTotal">0</b><small>bloqueados nesta aba</small></div>
      <div><b id="cRastreadores">0</b><small>rastreadores</small></div>
      <div><b id="cSocial">0</b><small>redes sociais</small></div>
      <div><b id="cImpressao">0</b><small>impressão digital</small></div>
    </div>
  </section>

  <section class="bloco" id="blocoIE">
    <button id="abrirIE" class="botao largo">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14.9-4M20 12a8 8 0 0 1-14.9 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M19 3v5h-5M5 21v-5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Recarregar no modo Internet Explorer
    </button>
    <label class="linha pequena">
      <span>Sempre abrir este site no modo IE</span>
      <span class="chave"><input type="checkbox" id="sempreIE"><span></span></span>
    </label>
  </section>

  <section class="bloco" id="blocoConteiner">
    <strong>Abrir em um contêiner</strong>
    <div id="listaConteineres" class="lista-conteineres"></div>
    <label class="linha pequena">
      <span>Sempre abrir este site em</span>
      <select id="conteinerSempre" class="campo mini"></select>
    </label>
  </section>

  <footer class="rodape">
    <a href="painel.html" target="_blank">Painel</a>
    <a href="painel.html#extensoes" target="_blank">Extensões</a>
    <a href="painel.html#atualizacoes" target="_blank">Atualizações</a>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
