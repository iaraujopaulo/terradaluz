<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Aberto no modo Internet Explorer</title>
  <link rel="icon" href="../icones/icone-32.png">
  <link rel="stylesheet" href="../estilo/base.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .caixa { max-width: 560px; padding: 32px; display: grid; gap: 14px; text-align: center; justify-items: center; }
    .endereco { font-family: ui-monospace, Consolas, monospace; font-size: 13px; word-break: break-all; color: var(--texto-2); }
    .botoes { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <main class="caixa cartao">
    <img src="../icones/icone-128.png" alt="" width="72" height="72">
    <h1>Este site abriu no modo Internet Explorer</h1>
    <p class="mudo">Ele está na lista de sites antigos que precisam do motor do IE. Procure a janela “Terra da Luz — Modo Internet Explorer”.</p>
    <div class="endereco" id="endereco"></div>
    <div class="botoes">
      <button id="aqui" class="botao">Abrir aqui no modo moderno</button>
      <a class="botao" href="painel.html#modoie">Gerenciar lista</a>
    </div>
  </main>
  <script type="module" src="modoie.js"></script>
</body>
</html>
