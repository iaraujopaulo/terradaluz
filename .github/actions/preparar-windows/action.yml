name: Preparar compilação do Terra da Luz (Windows)
description: Baixa o ungoogled-chromium-windows na versão indicada, aplica o Terra da Luz e prepara a máquina.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Baixar ungoogled-chromium-windows
      shell: pwsh
      run: |
        $cfg = Get-Content terra.config.json -Raw | ConvertFrom-Json
        $repo = $cfg.ungoogledChromiumWindows.repositorio
        $tag = $cfg.ungoogledChromiumWindows.tag
        git clone --depth 1 --branch $tag --recurse-submodules --shallow-submodules $repo ucw
        if ($LASTEXITCODE -ne 0) { throw "falha ao baixar $repo@$tag" }

    - name: Aplicar o Terra da Luz
      shell: pwsh
      run: python chromium/integrar.py ucw

    - name: Copiar para C:\ungoogled-chromium-windows
      shell: pwsh
      run: Copy-Item -Path ucw -Destination 'C:\ungoogled-chromium-windows' -Recurse

    - name: Dependências da etapa de compilação
      shell: pwsh
      working-directory: ./ucw/.github/actions/stage
      run: npm install

    - name: Windows SDK 10.0.28000.0
      shell: pwsh
      run: |
        if (Test-Path 'C:\Program Files (x86)\Windows Kits\10\Include\10.0.28000.0') { exit 0 }
        $installer = "$env:TEMP\winsdksetup.exe"
        Invoke-WebRequest -Uri 'https://download.microsoft.com/download/38ab8f6d-3676-4860-ae84-3361308b9d7f/KIT_BUNDLE_WINDOWSSDK_MEDIACREATION/winsdksetup.exe' -OutFile $installer
        $features = '/features OptionId.DesktopCPPx64 OptionId.DesktopCPPx86 OptionId.DesktopCPPArm64 OptionId.WindowsDesktopDebuggers OptionId.UWPCPP OptionId.SigningTools /q /norestart /ceip off'
        $proc = Start-Process -FilePath $installer -ArgumentList $features -PassThru -Wait
        if ($proc.ExitCode -ne 0) { throw "winsdksetup.exe falhou: $($proc.ExitCode)" }
